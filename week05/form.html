<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WDD 131 - Dynamic Web Fundamentals. Osondu Benjamin Ihentuge's Product Review Form."
    />
    <meta name="author" content="Osondu Benjamin Ihentuge" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&family=Poppins:wght@400;700&family=Lato&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/form.css" />
    <script defer src="scripts/form.js"></script>

    <title>Product Review | WDD 131</title>
  </head>

  <body>
    <main>
      <h1>Product Review</h1>

      <form method="get" class="pr" action="review.html">
        <fieldset>
          <label for="product">Product Name</label>
          <select id="product" name="product" required>
            <option value="" disabled selected>Select a Product ...</option>
          </select>

          <label>Overall Rating</label>
          <div class="star-rating">
            <input type="radio" name="stars" id="star5" value="5" required />
            <label for="star5"></label>

            <input type="radio" name="stars" id="star4" value="4" />
            <label for="star4"></label>

            <input type="radio" name="stars" id="star3" value="3" />
            <label for="star3"></label>

            <input type="radio" name="stars" id="star2" value="2" />
            <label for="star2"></label>

            <input type="radio" name="stars" id="star1" value="1" />
            <label for="star1"></label>
          </div>

          <label for="date">Date of Installation</label>
          <input type="date" id="date" name="installationDate" required />

          <div class="input-checkbox">
            <p>Which features did you find useful? (check all that apply)</p>

            <label>
              <input type="checkbox" name="durability" value="yes" />
              Durability
            </label>

            <label>
              <input type="checkbox" name="easeOfUse" value="yes" />
              Ease of Use
            </label>

            <label>
              <input type="checkbox" name="performance" value="yes" />
              Performance
            </label>

            <label>
              <input type="checkbox" name="design" value="yes" />
              Design
            </label>
          </div>

          <label for="review">Written Review (optional)</label>
          <textarea id="review" name="writtenReview" rows="4"></textarea>

          <label for="name">Your Name (optional)</label>
          <input type="text" id="name" name="reviewerName" />

          <input type="submit" value="Post Review" />
        </fieldset>
      </form>
    </main>

    <footer>
      <p>
        &copy; <span id="currentYear"></span> 🏋️ Osondu Benjamin Ihentuge 🏋️
        Nigeria
      </p>
      <p id="lastModified"></p>
    </footer>
  </body>
</html>
